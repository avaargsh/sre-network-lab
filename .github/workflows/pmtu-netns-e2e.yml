name: PMTU kernel lab (isolated network namespaces)
on:
  pull_request:
    paths:
      - '.github/workflows/pmtu-netns-e2e.yml'
      - 'scripts/lab_pmtu.py'
      - 'scripts/verify_pmtu_evidence.py'
      - 'tests/test_pmtu_lab.py'
      - 'scenarios/mtu/**'
      - 'environments/vm/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-pmtu-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SRE_LAB_ALLOW_MUTATIONS: "1"
      SRE_LAB_SCOPE: dedicated-netns
      RUN_ID: pmtu-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_DIR: /tmp/sre-pmtu-evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install isolated Linux networking tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables iputils-ping tcpdump
      - name: Confirm isolated namespace names are unused
        run: |
          ip netns list
          for name in sre-pmtu-src sre-pmtu-hop sre-pmtu-dst; do
            if ip netns list | awk '{print $1}' | grep -Fxq "$name"; then
              echo "Reserved namespace already exists: $name" >&2
              exit 1
            fi
          done
      - name: Real kernel PMTU discovery and blackhole drill
        run: sudo env SRE_LAB_ALLOW_MUTATIONS=1 SRE_LAB_SCOPE=dedicated-netns RUN_ID="$RUN_ID" EVIDENCE_DIR="$EVIDENCE_DIR" python3 scripts/lab_pmtu.py
      - name: Independently validate captured evidence and cleanup
        run: |
          python3 scripts/verify_pmtu_evidence.py "$EVIDENCE_DIR/$RUN_ID"
          test -z "$(ip netns list | grep -E '^sre-pmtu-(src|hop|dst)( |$)' || true)"
      - name: Make generated synthetic evidence readable by artifact uploader
        if: always()
        run: |
          if [ -d "$EVIDENCE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE_DIR"
          fi
      - name: Upload scoped synthetic PMTU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-pmtu-evidence
          path: /tmp/sre-pmtu-evidence/
          retention-days: 7
          if-no-files-found: warn
