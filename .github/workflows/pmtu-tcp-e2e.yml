name: TCP PMTU blackhole and MSS mitigation (Linux kernel)
on:
  pull_request:
    paths:
      - '.github/workflows/pmtu-tcp-e2e.yml'
      - 'scripts/lab_pmtu_tcp.py'
      - 'scripts/pmtu_http_endpoint.py'
      - 'scripts/verify_pmtu_tcp_evidence.py'
      - 'scripts/lab_pmtu.py'
      - 'scripts/verify_pmtu_evidence.py'
      - 'tests/test_pmtu_tcp.py'
      - 'scenarios/mtu/tcp.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcp-pmtu-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RUN_ID: tcp-pmtu-\${{ github.run_id }}-\${{ github.run_attempt }}
      EVIDENCE_DIR: /tmp/sre-pmtu-tcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install packet tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables tcpdump ethtool
      - name: Check isolated namespace reservation
        run: |
          for ns in sre-pmtu-src sre-pmtu-hop sre-pmtu-dst; do
            if ip netns list | awk '{print $1}' | grep -Fxq "$ns"; then
              echo "Reserved namespace already exists: $ns" >&2
              exit 1
            fi
          done
      - name: Real Linux TCP HTTP PMTU and MSS recovery
        run: |
          sudo env \
            SRE_LAB_ALLOW_MUTATIONS=1 \
            SRE_LAB_SCOPE=dedicated-netns \
            RUN_ID="$RUN_ID" \
            EVIDENCE_DIR="$EVIDENCE_DIR" \
            python3 scripts/lab_pmtu_tcp.py
      - name: Independently audit PCAP TCP and HTTP results
        run: |
          sudo python3 scripts/verify_pmtu_tcp_evidence.py "$EVIDENCE_DIR/$RUN_ID"
          test -z "$(ip netns list | grep -E '^sre-pmtu-(src|hop|dst)( |$)' || true)"
      - name: Permit artifact uploader to read synthetic evidence
        if: always()
        run: |
          if [ -d "$EVIDENCE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE_DIR"
          fi
      - name: Upload synthetic TCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-pmtu-mss-evidence
          path: /tmp/sre-pmtu-tcp/
          retention-days: 7
          if-no-files-found: warn
