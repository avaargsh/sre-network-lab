apiVersion: v1
kind: Namespace
metadata:
  name: sre-lab-dns
  labels:
    app.kubernetes.io/part-of: sre-network-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-dns-echo
  namespace: sre-lab-dns
  labels:
    app.kubernetes.io/part-of: sre-network-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-dns-echo}
  template:
    metadata:
      labels: {app: lab-dns-echo}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=sre-network-lab-dns-ok"]
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 1
            periodSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-dns-probe
  namespace: sre-lab-dns
  labels:
    app.kubernetes.io/part-of: sre-network-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-dns-probe}
  template:
    metadata:
      labels: {app: lab-dns-probe}
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: probe
          image: nicolaka/netshoot:v0.14
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-dns-echo
  namespace: sre-lab-dns
  labels:
    app.kubernetes.io/part-of: sre-network-lab
spec:
  selector: {app: lab-dns-echo}
  ports:
    - name: http
      port: 80
      targetPort: http
