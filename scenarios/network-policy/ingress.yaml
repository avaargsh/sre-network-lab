apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-deny-ingress
  namespace: sre-lab-policy
  labels: {app.kubernetes.io/part-of: sre-network-lab}
spec:
  podSelector: {matchLabels: {app: lab-policy-server}}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-allow-allowed
  namespace: sre-lab-policy
  labels: {app.kubernetes.io/part-of: sre-network-lab}
spec:
  podSelector: {matchLabels: {app: lab-policy-server}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: lab-policy-allowed}}
      ports: [{protocol: TCP, port: 5678}]
