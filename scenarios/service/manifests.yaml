apiVersion: v1
kind: Namespace
metadata:
  name: sre-lab-service
  labels:
    app.kubernetes.io/part-of: sre-network-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-echo
  namespace: sre-lab-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-echo
  template:
    metadata:
      labels:
        app: lab-echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=sre-network-lab-ok"]
          ports:
            - containerPort: 5678
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-probe
  namespace: sre-lab-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-probe
  template:
    metadata:
      labels:
        app: lab-probe
    spec:
      containers:
        - name: probe
          image: nicolaka/netshoot:v0.14
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-echo
  namespace: sre-lab-service
spec:
  selector:
    app: lab-echo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
